name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build versioned release JAR
        run: ./gradlew jar -Pmod_version="${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release artifact
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" build/libs/magicavoxel-loader-*.jar --generate-notes --title "$GITHUB_REF_NAME"
